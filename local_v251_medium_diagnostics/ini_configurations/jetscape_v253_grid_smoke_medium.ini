# jetscape.ini v7.3 — single source of truth (bash-friendly + C++-parsable)
# CHANGELOG
# v7.4-v253 (grid-review smoke medium):
#   • NEW: Tiny WSU grid smoke INI for validated v253 pp medium-activation workflow review.
#   • SET: NUM_EVENTS=1, PT_LO/PT_HI=(30-50,80-120), JOBS=(20,20), Multiplier=1, MaxActiveJobs=1000.
#   • SET: PythiaIsrMaxAttemptsPerTask=30, PythiaIsrRetrySeedStride=7919, BASE_SEED=253900000.
#   • KEEP: sqrt(s)=13 TeV, no hydro reuse, no qhat/Q0/hydro_Tc/medium-strength tuning.
# v7.3 (paper-ready vac/medium comparison target alignment):
#   • FIX: Point COMPARE_RUN_TAG_A/B at the current realistic pp vacuum/medium production tags instead of the retired vacuum_tenmil/brick_tenmil pair.
#   • FIX: Label run B as medium so paperreadycomparisor outputs, ratio labels, and logs match the vac/medium workflow.
#   • SAFETY: No simulation physics, XML, pThat, seed, analysis cuts, merge controls, or SLURM limits changed.
#
# v7.2 (ROOT macro merge engine controls):
#   • NEW: MergeMergeEngine="root_macro" avoids observed direct-hadd stall at /counts by explicitly adding ROOT histograms with TH1::Add.
#   • NEW: MergeRootMergeProgressEvery controls file-progress logging inside the custom ROOT merge macro.
#   • FALLBACK: Set MergeMergeEngine="hadd" to compare against the old direct hadd path.
#   • KEEP: No simulation physics, XML, pThat, seed, analysis cuts, normalization, or plotting settings changed.
#
# v7.1 (direct one-shot bundled merge controls):
#   • CHANGE: Remove active staged-hadd/heartbeat knobs from the merge workflow. Merge now runs one direct per-slice hadd over accepted bundle ROOT files.
#   • NEW: MergeUseLocalTmp=1 writes temporary merged ROOT products under $TMPDIR when Slurm provides it, then publishes validated outputs back to final/.
#   • KEEP: MergeHaddEchoOutput=0 saves full hadd stdout/stderr under logs/merge/hadd_logs without flooding the main Slurm log.
#   • KEEP: No simulation physics, XML, pThat, seed, analysis cuts, normalization, or plotting settings changed.
#
# v7.0 (fast staged merge polling):
#   • FIX: MergeHaddPollSec=2 prevents staged hadd from waiting a full heartbeat interval before detecting quick hadd completion.
#   • NEW: MergeValidateStageParts=0 skips redundant validation of intermediate staged ROOTs; final per-slice and final ROOT validation remain mandatory.
#   • NEW: MergeFinalCopySingleSlice=1 avoids a redundant final one-input hadd when only one pThat slice is merged.
#   • KEEP: No simulation physics, XML, pThat, seed, analysis cuts, normalization, plotting, or output-folder setting changed.
#
# v6.9 (lean bundled merge workflow):
#   • NEW: MergeStrictNormScan=0 by default so merge uses the first accepted bundle meta for xsec summary instead of re-reading norm fields from every bundle meta.
#   • KEEP: MergeHaddStaged=1, MergeHaddGroupSize=50, MergeHaddHeartbeatSec=60, and MergeHaddEchoOutput=0 for staged hadd with heartbeat diagnostics.
#   • KEEP: No simulation physics, XML, pThat, seed, analysis cuts, plotting, or output-folder setting changed.
#
# v6.8 (verbose bundled merge diagnostics):
#   • NEW: MergeVerboseBundleLogs=1, MergeScanLogEvery=50, MergeHaddEchoOutput=0, MergeHaddStaged=1, MergeHaddGroupSize=50, and MergeHaddHeartbeatSec=60 keep bundled merge logs explicit instead of silent during scans/hadd.
#   • KEEP: No simulation physics, XML, pThat, seed, normalization, analysis, plotting, or output-folder setting changed.
#
# v6.7 (bundled analysis folder alignment):
#   • FIX: Keep legacy AN_BATCH_ID aligned with AnalysisBatchID for bundled analysis so manager/worker/merge all use bundle0 consistently.
#   • KEEP: No simulation physics, XML, pThat, seed, normalization, merge, or plotting setting changed.
#
# v6.6 (bundled analysis diagnostics):
#   • NEW: AnalysisBundleScanLogEvery controls manager scan/progress logging for bundled analysis.
#   • KEEP: AnalysisMaxActiveBundleJobs=100 and AnalysisBundleTime=04:00:00 safer defaults.
#   • NO PHYSICS CHANGE: Simulation/XML/jet/particle cuts and normalization knobs unchanged.
#
# v6.5 (bundled analysis safety defaults):
#   • CHANGE: AnalysisMaxActiveBundleJobs default lowered from 1000 to 100 to avoid shared-filesystem stampedes.
#   • CHANGE: AnalysisBundleTime default raised from 02:00:00 to 04:00:00 for safer bundled production jobs.
#   • DOC: Manager walltime is controlled by #SBATCH --time in submit_sliced_analysis.sh or MANAGER_TIME env override.
#
# v6.4 (bundled hadron analysis controls):
#   • NEW: AnalysisInputMode="bundled_hadrons" and AnalysisBundleSize control temporary hadron-file concatenation for analysis.
#   • NEW: AnalysisMaxActiveBundleJobs, AnalysisBundleTime, AnalysisBundleMem, and AnalysisBundleCPUs control bundled analysis Slurm jobs.
#   • REMOVE: Retires chunked-analysis-only knobs from the active config while preserving sim/analysis/merge/plotting physics knobs.
#
# v6.3 (chunked analysis controls):
#   • NEW: AnalysisTasksPerJob, AnalysisChunkTime, AnalysisChunkMem, and AnalysisChunkCPUs for submit_sliced_analysis_chunked.sh.
#   • CHANGE: AnalysisSelfHealMaxPasses=5 and AnalysisSelfHealGraceSec=20 by default because chunked jobs reduce transient tiny-job churn.
# v6.2 (sim worker log cleanup + 1-based attempt records):
#   • CHANGE: Default smoke-test RUN_TAG now pprealistic_vac_25test_v10_10 to avoid mixing with previous v10.9 results.
#   • CHANGE: Default Multiplier=2 for the 50-task vacuum smoke-test pattern already validated by the user.
#   • DOC: submit_jetscape_sliced.slurm v7.1 writes 1-based attempt records and captures failed retry stderr in attempt.log.
# v6.1 (fresh smoke-test run tag after Slurm PYTHIA8DIR fix):
#   • CHANGE: Default RUN_TAG is now pprealistic_vac_25test_v10_9 to avoid reusing failed v10.8 seed/meta records.
#   • NO CHANGE: Physics settings remain eCM=13000, pThat=30–3000, NUM_EVENTS=1, JOBS=(25), and RealisticPPWorkflow=1.
# v6.0 (realistic pp PythiaIsrMUSIC grid smoke-test controls):
#   • SWITCH: Default simulation path changed from toy brick runJetscape to realistic pp PythiaIsrMUSIC.
#   • NEW: RealisticPPWorkflow=1, PythiaIsrMainXml, PythiaIsrInputDir, PythiaIsrMaxAttemptsPerTask, and related staging/retry knobs.
#   • CHANGE: NUM_EVENTS=1 and JOBS=(25) for the first Wayne-grid smoke test; increase JOBS back up to <=1000 only after validation.
#   • CHANGE: MultiSimEnabled=0 because this test is not a 3x brick-length/qhat scan.
#   • CHANGE: EXE_NAME=PythiaIsrMUSIC and XML_TEMPLATE defaults to the realistic vacuum grid XML.
#   • KEEP: Existing analysis/merge/plotting knobs remain present for downstream compatibility.
# v5.7 (analysis self-heal controls + flexible multisim plotting):
#   • NEW: Add AnalysisSelfHealEnable, AnalysisSelfHealMaxPasses, AnalysisSelfHealGraceSec, and AnalysisFailOnMissing for submit_sliced_analysis.sh v4.28 bounded repair behavior.
#   • DOC: MultiSimBrickLengths and MultiSimQhat0Values are now documented as arbitrary nonempty arrays for vacbrick_plotter_py.py v1.1, not a hard-coded 3×3 grid.
#   • SAFETY: Physics cuts, pThat slicing values, seeds, Slurm caps, and XML selections are unchanged.
# v5.6 (single-brick knob support with placeholder XML):
#   • NEW: Add SingleBrickLength and SingleQhat0 for the legacy single-brick path when MultiSimEnabled=0.
#   • FIX: These values are now consumed by the sim-side single-run rendering path so the placeholder brick XML can still be used safely without falling back to array defaults.
# v5.5 (multisim control knobs for brick scans):
#   • NEW: Add MultiSimEnabled=0|1 as the top-level switch for wrapper-driven multi-medium scans.
#   • NEW: Add MultiSimBrickLengths=(...) and MultiSimQhat0Values=(...) so one brick submission/analysis wrapper can sweep
#     the requested 3×3 toy-medium grid while leaving the legacy single-run path unchanged when MultiSimEnabled=0.
#   • NEW: Wrapper-generated per-variant ini files override RUN_TAG/RUNS_BASE/DIR_* and force MultiSimEnabled back to 0,
#     so downstream single-run managers/workers keep their old logic while outputs stay fully separated by variant run tag.
# v5.4 (comment/changelog consistency cleanup):
#   • DOC: Correct the v5.2 changelog note to match the live watchdog threshold now configured in this file.
#   • NO CHANGE: Runtime behavior is unchanged; this patch only fixes comment/history drift.
# v5.3 (safer stuck-job watchdog + final-drain resubmit fix support):
#   • NEW: Add SimWatchdogAllowRuntimeOnlyKill=0 so old RUNNING jobs are not auto-scancelled solely for age unless you explicitly opt in.
#   • SAFETY: This keeps automatic held-job recovery and finished-task resubmission intact while removing false resubmits of legitimate long sim jobs.
# v5.2 (faster watchdog reaction + separator-tolerant held-reason match):
#   • FIX: SimWatchdogHeldReasonRegex now uses a separator-tolerant pattern so one config matches
#     launch failed requeued held, launch_failed_requeued_held, or launch-failed-requeued-held.
#   • TUNE: Reduce SimWatchdogCheckSec from 300 to 60 so short failed sim jobs are noticed sooner without affecting the current SimWatchdogStuckRunSec threshold configured below.
# v5.0 (real sim meta-grace + retire fake hadron-fallback knob):
#   • CLEANUP: Remove SimWatchdogHadronFallback because the sim manager always validates hadron outputs directly when needed and no longer advertises a dead toggle.
#   • FIX: SimWatchdogMetaGraceSec is now a real watchdog/manager grace window before finished-task quarantine/resubmit when a hadron file exists but metadata/output validation may still be settling.
# v4.8 (Mjj back-to-back knob + analyzer full-range contract):
#   • NEW: Add required MJJ_REQUIRE_BACKTOBACK=0|1 so Mjj can explicitly enable/disable its extra back-to-back gate without overloading DIJET_BACKTOBACK_TOL_DEG.
#   • CHANGE: DIJET_BACKTOBACK_TOL_DEG now acts as the Mjj back-to-back tolerance only when MJJ_REQUIRE_BACKTOBACK=1.
#   • SAFETY: This keeps analyzer/fitter/comparisor titles honest when the Mjj back-to-back requirement is disabled.
# v4.7 (rename sim extra-file knob):
#   • RENAME: Replace WriteSimMetaFiles with WriteSimExtraFiles for the simulation-only sidecar toggle.
#   • NO CHANGE: This knob still controls only the extra per-task xsec_*.txt, weight_*.txt, xsecerr_*.txt files.
# v4.6 (analysis selection + histogram-range update):
#   • NEW (required by analyze_dphi_sliced.cpp v9.6.0+): DIJET_REQUIRE_EXACTLY_TWO_JETS=0|1.
#     - 0: dijet-dependent histograms require >=2 accepted jets and use the leading two (previous behavior).
#     - 1: dijet-dependent histograms require exactly 2 accepted jets after the jet pT/eta acceptance cuts.
#   • CHANGE: Update default analysis ranges/cuts for the current study





# [all]
RUN_TAG="ppreal_v253_grid_smoke_medium"
RUNS_BASE="$HOME/xscape_runs/${RUN_TAG}"
ManagerMail=1
MailUser="hv0429@wayne.edu"
ENGINE_NAME="xscape"
DIR_FINAL="${RUNS_BASE}/final"
INCLUDE_XSEC_NORM_ERR=1       

# RUN_TAG: common run identifier; all major output and log paths are built from this tag.
# ManagerMail: 1 sends one manager-level email per completed step; task jobs stay silent.
# MailUser: email address used when ManagerMail=1.
# ENGINE_NAME: framework label used in metadata and path construction across the workflow.
# DIR_FINAL: final merged output directory; fitter and comparisor read published ROOT files from here.
# INCLUDE_XSEC_NORM_ERR: controls whether global cross-section normalization uncertainty is propagated when available.






# [sim]
SEED_SALT_TIME=0
WriteSimLogs=1
WriteSimExtraFiles=0           
SimWatchdogEnable=1         
SimWatchdogCheckSec=60     
SimWatchdogStuckRunSec=900 
SimWatchdogKillStuck=1      
SimWatchdogAllowRuntimeOnlyKill=0
SimWatchdogMaxResubmits=20  
SimWatchdogKillHeld=1
SimWatchdogHeldReasonRegex="launch[ _-]+failed[ _-]+requeued[ _-]+held"
SimWatchdogMetaGraceSec=120
SeedStrideSlice=1000000     
BUILD_SUBDIR="build"
CONFIG_SUBDIR="config"
XML_TEMPLATE="jetscape_user_pp_realistic_medium_grid.xml"
SLURM_SIM_SCRIPT="submit_jetscape_sliced.slurm"
ADD_REPO_LIB_TO_LD_LIBRARY_PATH=1         
REPO_LIB_SUBDIR="lib"
SYSTEM_LD_PREPEND="/usr/lib64"            
KEEP_TEMP_XML=1                          
RUN_LDD_ON_START=0                       
BASE_SEED=253900000

# SEED_SALT_TIME: 1 adds time-based salt to simulation seeds; 0 keeps deterministic seed generation.
# WriteSimLogs: 1 writes per-task simulation logs; 0 disables the extra sim log files.
# WriteSimExtraFiles: 0 only disables the extra per-task xsec_*.txt, weight_*.txt, xsecerr_*.txt files.
# SimWatchdogEnable: enables the sliced simulation watchdog/resubmission manager for Multiplier>1 runs.
# SimWatchdogCheckSec: watchdog poll interval in seconds for checking active simulation tasks.
# SimWatchdogStuckRunSec: RUNNING jobs at or above this age are considered old enough for stuck-job review.
# SimWatchdogKillStuck: 1 enables stuck-job handling for RUNNING jobs once the runtime threshold is crossed.
# SimWatchdogAllowRuntimeOnlyKill: 1 restores age-only scancel+resubmit for old RUNNING jobs; 0 keeps them in observe-only mode unless another failure signal appears.
# SimWatchdogMaxResubmits: maximum submission attempts per simulation task within one manager run.
# SimWatchdogKillHeld: 1 allows watchdog cleanup/resubmission for held jobs that match the held-reason regex.
# SimWatchdogHeldReasonRegex: regex used to decide which held-job reasons are considered auto-recoverable.
# SimWatchdogMetaGraceSec: grace window in seconds before the manager/watchdog quarantines and resubmits a finished task when a hadron file exists but metadata/output validation may still be settling on the filesystem.
# SeedStrideSlice: seed stride between pTHat slices so slice/task combinations stay uncorrelated.
# BUILD_SUBDIR: relative build directory containing the compiled simulation executable.
# CONFIG_SUBDIR: relative config directory containing the XML templates.
# XML_TEMPLATE: XML template passed to the simulation worker for this run.
# SLURM_SIM_SCRIPT: Slurm worker script launched by the sliced simulation manager.
# ADD_REPO_LIB_TO_LD_LIBRARY_PATH: 1 prepends the repo lib directory to LD_LIBRARY_PATH in simulation jobs.
# REPO_LIB_SUBDIR: relative library subdirectory appended when ADD_REPO_LIB_TO_LD_LIBRARY_PATH=1.
# SYSTEM_LD_PREPEND: system library path appended by the simulation worker for ABI/runtime safety.
# KEEP_TEMP_XML: 1 keeps per-task rendered XML files for debugging; 0 removes them.
# RUN_LDD_ON_START: 1 runs ldd on the executable at job start for debugging shared-library issues.
# BASE_SEED: base RNG seed used by the simulation worker before slice/task offsets are added.






# [realistic pp PythiaIsrMUSIC grid workflow]
RealisticPPWorkflow=1
RealisticPPMode="medium"
XML_TEMPLATE_VAC="jetscape_user_pp_realistic_vac_grid.xml"
XML_TEMPLATE_MEDIUM="jetscape_user_pp_realistic_medium_grid.xml"
PythiaIsrMainXml="jetscape_main.xml"
PythiaIsrInputDir="myanalysis"
PythiaIsrStageFiles="mcglauber.input music_input_Luke iSS_parameters.dat"
PythiaIsrTablesDir="build/tables"
PythiaIsrISSTablesDir="build/iSS_tables"
PythiaIsrEOSDir="myanalysis/EOS"
PythiaIsrMaxAttemptsPerTask=30
PythiaIsrRetrySeedStride=7919
PythiaIsrTreatZeroSurfaceAsRetry=1

# RealisticPPWorkflow: 1 activates the staged PythiaIsrMUSIC worker path in submit_jetscape_sliced.slurm.
# RealisticPPMode: label only; set RUN_TAG/XML_TEMPLATE/BASE_SEED consistently when switching vac <-> medium.
# XML_TEMPLATE_VAC/XML_TEMPLATE_MEDIUM: convenience names for the two realistic pp XML templates.
# PythiaIsrMainXml: main XML passed as the second PythiaIsrMUSIC argument; stored in config/.
# PythiaIsrInputDir: directory containing mcglauber.input, music_input_Luke, iSS_parameters.dat, and EOS/.
# PythiaIsrStageFiles: whitespace-separated files copied into each per-attempt working directory.
# PythiaIsrTablesDir/PythiaIsrISSTablesDir/PythiaIsrEOSDir: runtime data directories symlinked into each attempt dir.
# PythiaIsrMaxAttemptsPerTask: internal retries per Slurm task for stochastic pp zero-surface/iSS failures.
# PythiaIsrRetrySeedStride: seed jump between internal attempts.
# PythiaIsrTreatZeroSurfaceAsRetry: documents expected retry behavior; worker retries any failed/missing-hadron attempt.

# [sim+analysis+merge+fitter]
DIR_SIM="${RUNS_BASE}/sim"

# DIR_SIM: simulation output root containing slice directories and hadron outputs.





# [multisim wrappers]
MultiSimEnabled=0
MultiSimBrickLengths=(0.5 1.0 2.0)
MultiSimQhat0Values=(0.25 0.5 0.75)
SingleBrickLength=1.0
SingleQhat0=0.5

# MultiSimEnabled: 1 enables the wrapper-driven brick scan (one command fans over brick length × qhat0 variants).
#   0 keeps the legacy single-run workflow unchanged.
# MultiSimBrickLengths: nonempty brick-length values (fm) swept by the multisim wrappers/plotter when MultiSimEnabled=1.
# MultiSimQhat0Values: nonempty qhat0 values swept by the multisim wrappers/plotter when MultiSimEnabled=1.
# SingleBrickLength: brick length (fm) used by the single-run brick path when MultiSimEnabled=0 and the brick XML template still contains placeholders.
# SingleQhat0: qhat0 used by the single-run brick path when MultiSimEnabled=0 and the brick XML template still contains placeholders.


# [sim+analysis+merge]
Multiplier=1
DIR_LOG_SIM="${RUNS_BASE}/logs/sim"
PT_LO=(30 80)
PT_HI=(50 120)
NUM_EVENTS=1
JOBS=(20 20)

# Multiplier: repeats the full sliced task pack this many times without exceeding the job cap.
# DIR_LOG_SIM: simulation log root used by sim, analysis, and merge checks.
# PT_LO: lower pTHat edges in GeV for each simulation slice.
# PT_HI: upper pTHat edges in GeV for each simulation slice.
# NUM_EVENTS: events per simulation task for each slice submission.
# JOBS: number of tasks submitted per slice before Multiplier expansion.





# [sim+analysis]
SIM_BATCH_ID="batch0"
MaxActiveJobs=1000
SubmitPollSec=30
AnalysisInputMode="bundled_hadrons"
AnalysisBatchID="bundle0"
AnalysisBundleSize=100
AnalysisMaxActiveBundleJobs=100
AnalysisBundleTime="00:30:00"
AnalysisBundleMem="2G"
AnalysisBundleCPUs=1
AnalysisBundleScanLogEvery=50

# Bundled merge diagnostics and direct-hadd controls.
MergeVerboseBundleLogs=1
MergeScanLogEvery=50
MergeHaddEchoOutput=0
MergeMergeEngine="root_macro"
MergeRootMergeProgressEvery=50
MergeUseLocalTmp=1
MergeStrictNormScan=0
MergeFinalCopySingleSlice=1
AnalysisSelfHealEnable=1
AnalysisSelfHealMaxPasses=5
AnalysisSelfHealGraceSec=20
AnalysisFailOnMissing=1
EXE_NAME="PythiaIsrMUSIC"

# SIM_BATCH_ID: stable simulation batch folder name used by sim reruns and downstream analysis lookup.
# MaxActiveJobs: submission-manager cap for simultaneous active jobs.
# SubmitPollSec: manager poll interval in seconds while throttling job submission.
# AnalysisInputMode=bundled_hadrons makes analysis concatenate one-event hadron files into temporary per-bundle inputs.
# AnalysisBundleSize: number of one-event hadron files per temporary bundle.
# AnalysisMaxActiveBundleJobs: cap on simultaneous bundled analysis jobs, separate from MaxActiveJobs.
#   This does NOT change simulation granularity or output names; it only reduces analysis scheduler overhead.
# AnalysisBundleTime/AnalysisBundleMem/AnalysisBundleCPUs: Slurm resources for each bundled analysis worker job. Manager walltime comes from #SBATCH --time in submit_sliced_analysis.sh unless MANAGER_TIME is set.
# AnalysisBundleScanLogEvery: print scan/count progress every N bundles while keeping per-bundle skip/submit logs visible.
# AnalysisSelfHealEnable: 1 lets the analysis manager rescan and repair missing/incomplete ROOT+JSON outputs before final reporting.
# AnalysisSelfHealMaxPasses: maximum number of bounded repair passes in one analysis-manager run.
# AnalysisSelfHealGraceSec: filesystem-settling grace period before each analysis repair pass.
# AnalysisRebuildAnalyzer/AnalysisForceRebuildAnalyzer: kept as documented knobs, but v242.4 chunk manager always rebuilds the C++ analyzer before submitting chunks.
# AnalysisScanLogEvery: manager scan progress frequency; use 0 to silence progress.
# AnalysisVerboseSkips: 1 prints every skipped DONE task; keep 0 for large production to avoid huge logs.
# AnalysisFailOnMissing: 1 makes the analysis manager exit nonzero if missing/incomplete outputs remain after repair passes.
# EXE_NAME: compiled executable name invoked by sim jobs and recorded by downstream metadata consumers.





# [analysis+merge]
DIR_LOG_ANALYSIS="${RUNS_BASE}/logs/analysis"
ENABLE_RENORM=1

# DIR_LOG_ANALYSIS: analysis log root used by analysis submission and merge validation.
# ENABLE_RENORM: analysis/merge renormalization switch for the weight normalization pathway.





# [analysis+merge+fitter]
DIR_ANALYSIS="${RUNS_BASE}/analysis"

# DIR_ANALYSIS: analysis output root containing per-slice ROOT results used by merge and fitter.





# [analysis+fitter+comparisor]

SINGLE_SLICE_MODE=1

JET_RADIUS_LIST=(0.2 0.4 0.5 0.6)
JET_ETA_MAX=3.0               
JET_ETA_MODE=1               
SUBFRAC=0.5                 
YSTAR_ENABLE=0                
YSTAR_MAX=0.6                 
PT_LEAD_BIN_EDGES=(10 20 40 60 80 100 120 150 180 200 300 400 500)
DIJET_BACKTOBACK_TOL_DEG=30
MJJ_REQUIRE_BACKTOBACK=1
MJJ_MIN_GEV=30
MJJ_MAX_GEV=3000


# RUNS_BASE: top-level run directory expanded from RUN_TAG; reused by analysis path setup and plotting tools.
# JET_RADIUS_LIST: jet radii analyzed by the C++ analyzer and consumed by downstream plotting tools.
# JET_ETA_MAX: base jet pseudorapidity acceptance bound.
# JET_ETA_MODE: jet eta acceptance mode; 1 applies |eta_jet| < JET_ETA_MAX - R, 0 uses a fixed cut.
# SUBFRAC: minimum subleading-to-leading jet pT fraction for dijet selection.
# YSTAR_ENABLE: 1 enables the optional |y*| dijet centrality cut.
# YSTAR_MAX: maximum allowed |y*| when YSTAR_ENABLE=1.
# PT_LEAD_BIN_EDGES: leading-jet pT bin edges used by analyzer histograms and downstream plot labeling.
# DIJET_BACKTOBACK_TOL_DEG: back-to-back tolerance in degrees used by the optional Mjj back-to-back gate and related Mjj plot labels.
# MJJ_REQUIRE_BACKTOBACK: 1 enforces the extra Mjj back-to-back gate |Δφ-π|<=DIJET_BACKTOBACK_TOL_DEG; 0 disables that extra Mjj-only requirement.
# MJJ_MIN_GEV: minimum Mjj in GeV for analyzer histograms and downstream plot ranges.
# MJJ_MAX_GEV: maximum Mjj in GeV for analyzer histograms and downstream plot ranges.

# SINGLE_SLICE_MODE: 1 tells downstream fitter/comparisor that this run used one physical pTHat slice only, so normalized dijet plots may be relabeled from (1/σ_sel)dσ/dX to observable-specific (1/N_dijet,sel)dN/dX using merged selected_dijet_counts_summary.json. 0 keeps the default stitched-sample-safe σ_sel labeling.




# [analysis]
WriteAnalysisLogs=1
AN_BATCH_ID="bundle0"
JET_CONSTITUENTS_MODE="full"
PARTICLE_STATUS_FILTER=1
JET_PT_MIN=10               
JET_PT_MAX=1200             
LEAD_PT_MIN=10             
SUBLEAD_PT_MIN=10           
DIJET_REQUIRE_EXACTLY_TWO_JETS=0
CLUSTER_MIN=0.15           
EVENT_HEADER_PREFIX="#	Event"
XJ_NBINS=60
AJ_NBINS=60
ETA_NBINS=80
JETPT_BINS_MODE=logspace
JETPT_NBINS=60
IMBALANCE_REQUIRE_BACKTOBACK=1
IMBALANCE_BACKTOBACK_TOL_DEG=30
MJJ_ENABLE=1
MJJ_NBINS=150
MJJ_LOG_BINS=1

# WriteAnalysisLogs: 1 writes per-task analysis logs; 0 disables the extra analysis log files.
# AN_BATCH_ID: legacy analysis batch folder name. For bundled_hadrons, AnalysisBatchID is authoritative; keep this aligned with AnalysisBatchID unless intentionally running old per-task analysis.
# JET_CONSTITUENTS_MODE: analysis jet content mode: charged for charged-track jets, full for charged plus neutral jets.
# PARTICLE_STATUS_FILTER: analysis particle-status handling; 1 uses final-state auto-detect filtering, 0 keeps all statuses.
# JET_PT_MIN: minimum jet pT accepted by the analyzer in GeV.
# JET_PT_MAX: upper jet pT bound in GeV for jet-spectrum histogram binning.
# LEAD_PT_MIN: minimum leading-jet pT in GeV for dijet-dependent observables.
# SUBLEAD_PT_MIN: minimum subleading-jet pT in GeV for dijet-dependent observables.
# DIJET_REQUIRE_EXACTLY_TWO_JETS: 1 requires exactly two accepted jets for dijet observables; 0 allows two or more and uses the leading pair.
# CLUSTER_MIN: minimum constituent pT in GeV passed to jet clustering.
# EVENT_HEADER_PREFIX: event-header prefix used by the analyzer when parsing hadron ASCII files.
# XJ_NBINS: number of xJ histogram bins.
# AJ_NBINS: number of AJ histogram bins.
# ETA_NBINS: number of eta-related histogram bins.
# JETPT_BINS_MODE: jet-spectrum binning mode used by the analyzer, such as logspace.
# JETPT_NBINS: number of jet-spectrum bins when JETPT_BINS_MODE defines them algorithmically.
# IMBALANCE_REQUIRE_BACKTOBACK: 1 enforces a back-to-back cut before filling xJ/AJ histograms.
# IMBALANCE_BACKTOBACK_TOL_DEG: back-to-back tolerance in degrees used for the xJ/AJ requirement.
# MJJ_ENABLE: 1 enables dijet invariant-mass histograms in the analyzer.
# MJJ_NBINS: number of Mjj histogram bins.
# MJJ_LOG_BINS: 1 uses logarithmic Mjj bins between MJJ_MIN_GEV and MJJ_MAX_GEV.





# [analysis+fitter]
PARTICLE_ETA_MAX=3.0          
DPHI_NBINS=360

# PARTICLE_ETA_MAX: maximum constituent pseudorapidity accepted before jet clustering.
# DPHI_NBINS: number of delta-phi histogram bins used by analysis and expected by fitter plots.





# [merge+fitter]
DIR_LOG_MERGE="${RUNS_BASE}/logs/merge"

# DIR_LOG_MERGE: merge log root used by merge publication and fitter submission checks.





# [fitter]
PLOTS_SUBDIR="plots"
JET_RADIUS=0.4                
FIT_WIN_PER_BIN_DEG=(40 40 40 40 40 40 40 40 40 40 40 40)
FIT_WIN_DEG=40
WIDTH_WEIGHTING=xsec         
TOL_FRACS="0.80,0.90,0.95"
THETA_SCAN_MAX_DEG=90
THETA_SCAN_STEP_DEG=1

# PLOTS_SUBDIR: subdirectory name under DIR_FINAL where fitter plot products are written.
# JET_RADIUS: nominal jet radius used by the fitter for single-R plot contexts.
# FIT_WIN_PER_BIN_DEG: per-leading-bin delta-phi fit window sizes in degrees.
# FIT_WIN_DEG: global default delta-phi fit window size in degrees.
