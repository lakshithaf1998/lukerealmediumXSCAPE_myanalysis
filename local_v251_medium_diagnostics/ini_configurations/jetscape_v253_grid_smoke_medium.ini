# MULTISIM_PLOT_VAC_RUN_TAG: vacuum run tag whose merged final/dphi_allSlices.root will be used as the common reference for grouped multisim plotting.
# MULTISIM_PLOT_BRICK_BASE_RUN_TAG: brick base run tag used to construct the 9 multisim variant tags <base>_L*_q* during grouped plotting.
# MULTISIM_PLOT_VAC_LABEL: legend label for the vacuum reference curve/panel in grouped multisim plots.
# MULTISIM_PLOT_BRICK_LABEL: base legend label for brick-medium grouped multisim plots; the varying parameter value is appended automatically in legends.


# COMPARE_RUN_TAG_A: first run tag for the medium-vs-reference comparison step.
# COMPARE_RUN_TAG_B: second run tag for the medium-vs-reference comparison step.
# COMPARE_LABEL_A: human-readable label for comparison run A in plot text and legends.
# COMPARE_LABEL_B: human-readable label for comparison run B in plot text and legends.
# COMPARE_RATIO_MODE: comparison ratio convention: med means B/A, inv means A/B.
# MJJ_COMPARE_RATIO_YMIN / MJJ_COMPARE_RATIO_YMAX: required comparator ratio-panel y-limits for Mjj overlays.
# JETPT_COMPARE_RATIO_YMIN / JETPT_COMPARE_RATIO_YMAX: required comparator ratio-panel y-limits for inclusive/lead/sublead jet-spectrum overlays and jet-spectrum ratio diagnostics.
# DPHI_COMPARE_RATIO_YMIN / DPHI_COMPARE_RATIO_YMAX: required comparator ratio-panel y-limits for standard Δφ comparison stacks.
# DPHI_ABS_COMPARE_RATIO_YMIN / DPHI_ABS_COMPARE_RATIO_YMAX: required comparator ratio-panel y-limits for folded |Δφ| comparison stacks.
# XJ_COMPARE_RATIO_YMIN / XJ_COMPARE_RATIO_YMAX: required comparator ratio-panel y-limits for x_J comparison stacks.
# AJ_COMPARE_RATIO_YMIN / AJ_COMPARE_RATIO_YMAX: required comparator ratio-panel y-limits for A_J comparison stacks.
# JETR_COMPARE_RATIO_YMIN / JETR_COMPARE_RATIO_YMAX: required comparator ratio-panel y-limits for jet-R ratio and double-ratio plots.
# LEAD_SUBLEAD_PROFILE_COMPARE_RATIO_YMIN / LEAD_SUBLEAD_PROFILE_COMPARE_RATIO_YMAX: required comparator ratio-panel y-limits for mean subleading-vs-leading jet-pT profile comparisons.

